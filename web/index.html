<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>电商智能客服 Agent · 调试台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2430;
  }
  header {
    padding: 12px 20px; background: #1f2430; color: #fff;
    display: flex; align-items: center; gap: 10px;
  }
  header b { font-size: 16px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .row { display: flex; margin-bottom: 12px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%; padding: 10px 14px; border-radius: 12px;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.ai .bubble { background: #fff; border: 1px solid #e5e7eb; }
  .row.user .bubble { background: #2f6bff; color: #fff; }
  .row.ai .bubble.thinking { color: #8a92a6; }
  .typing-dots { display: inline-flex; align-items: center; margin-left: 3px; }
  .typing-dots i {
    width: 4px; height: 4px; margin: 0 1.5px; border-radius: 50%;
    background: currentColor; opacity: .3;
    animation: typing 1.2s infinite ease-in-out;
  }
  .typing-dots i:nth-child(2) { animation-delay: .2s; }
  .typing-dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  #composer {
    display: flex; gap: 10px; padding: 14px 20px; background: #fff;
    border-top: 1px solid #e5e7eb;
  }
  #input {
    flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 10px;
    font-size: 15px; outline: none;
  }
  #input:focus { border-color: #2f6bff; }
  button {
    padding: 11px 20px; border: 0; border-radius: 10px; background: #2f6bff;
    color: #fff; font-size: 15px; cursor: pointer;
  }
  button:disabled { background: #a9bcff; cursor: not-allowed; }
  aside {
    width: 300px; border-left: 1px solid #e5e7eb; background: #fbfbfc;
    padding: 18px; overflow-y: auto;
  }
  aside h3 { margin: 0 0 8px; font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
  #state {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px;
    white-space: pre-wrap; font-size: 14px; min-height: 60px; color: #1f2430;
  }
  .usage {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px;
    font-size: 13px; color: #4b5563; line-height: 1.8; white-space: pre-wrap;
  }
  aside .sess { display: flex; gap: 8px; margin-top: 6px; }
  aside .sess input {
    flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;
  }
  aside .sess button { padding: 8px 12px; background: #6b7280; font-size: 14px; }
  .hint { margin-top: 18px; font-size: 12px; color: #9aa1ad; line-height: 1.7; }
</style>
</head>
<body>
  <header><span class="dot"></span><b>电商智能客服 Agent</b> · 调试台</header>
  <main>
    <section id="chat">
      <div id="messages"></div>
      <form id="composer" autocomplete="off">
        <input id="input" placeholder="输入消息，回车发送…" />
        <button id="send" type="submit">发送</button>
      </form>
    </section>
    <aside>
      <h3>用户画像 (State)</h3>
      <pre id="state">（暂无）</pre>
      <h3 style="margin-top:22px">本轮用量</h3>
      <div id="usage" class="usage">—</div>
      <h3 style="margin-top:22px">会话</h3>
      <div class="sess">
        <input id="session" value="web" />
        <button id="reset" type="button">重置</button>
      </div>
      <div class="hint">
        提示：<br>
        • 支持多轮对话，画像会自动积累<br>
        • 点"重置"清空当前会话记忆<br>
        • 同一 session 刷新页面后记忆仍在（已落盘）
      </div>
    </aside>
  </main>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stateEl = document.getElementById('state');
const usageEl = document.getElementById('usage');
const sessionEl = document.getElementById('session');

function addBubble(role, text, thinking = false) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble' + (thinking ? ' thinking' : '');
  b.textContent = text;
  row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return b;
}

function addTypingBubble() {
  const row = document.createElement('div');
  row.className = 'row ai';
  const b = document.createElement('div');
  b.className = 'bubble thinking';
  b.innerHTML = '正在输入<span class="typing-dots"><i></i><i></i><i></i></span>';
  row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return b;
}

async function send(text) {
  if (!text.trim()) return;
  addBubble('user', text);
  inputEl.value = '';
  sendBtn.disabled = true;

  const thinking = addTypingBubble();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionEl.value.trim() || 'web', message: text }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    thinking.parentElement.remove();
    const replies = data.replies && data.replies.length ? data.replies : ['（无回复）'];
    for (const r of replies) addBubble('ai', r);

    stateEl.textContent = (data.state && data.state.trim()) || '（暂无）';
    if (data.usage) {
      const u = data.usage;
      usageEl.textContent =
        u.llm_calls + ' 次调用 · 输入 ' + u.prompt_tokens + ' / 输出 ' + u.completion_tokens +
        ' tokens（缓存命中 ' + u.cached_tokens + '）\n耗时 ' + (u.latency_ms / 1000).toFixed(1) + 's';
    }
  } catch (e) {
    thinking.textContent = '请求失败：' + e.message;
    thinking.classList.remove('thinking');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

document.getElementById('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  send(inputEl.value);
});

document.getElementById('reset').addEventListener('click', async () => {
  const sid = sessionEl.value.trim() || 'web';
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sid }),
  });
  messagesEl.innerHTML = '';
  stateEl.textContent = '（暂无）';
  usageEl.textContent = '—';
  addBubble('ai', '会话「' + sid + '」已重置。');
});

inputEl.focus();
</script>
</body>
</html>
